[project]
name = "hcl-assistant"
version = "0.1.0"
requires-python = ">=3.11"
# Vercel installs this manifest; keep its runtime pins aligned with requirements.lock.
dependencies = [
    "psycopg==3.2.12",
    "psycopg-binary==3.2.12",
    "typing-extensions==4.16.0",
    "cryptography==50.0.0",
]

[tool.hcl-assistant]
backend = "Local: Python standard library / SQLite; cloud: psycopg / isolated Postgres"
provider-transport = false
