<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>HCL Assistant — Synthetic Preview</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="layout">
    <header>
      <button id="toggleSidebar" class="icon-button" aria-label="切换侧栏">☰</button>
      <strong>HCL</strong>
      <span class="preview-badge">Synthetic Preview · 未接入真实 HCL</span>
      <button id="resetPreview" class="header-action">重置预览</button>
    </header>

    <aside id="sidebar">
      <button id="newConversation">＋ 新对话</button>
      <label>范围
        <select id="memoryScope">
          <option value="CONVERSATION">仅会话</option>
          <option value="TOPIC">Topic</option>
          <option value="TEMPORARY">临时</option>
        </select>
      </label>
      <label>Topic
        <select id="topicSelect">
          <option value="">无 Topic</option>
          <option value="relationship">关系与合作</option>
          <option value="concepts">概念与价值</option>
        </select>
      </label>
      <small>Pages 预览只保存在当前浏览器，不会发送到服务器。</small>
      <nav id="conversationList" aria-label="对话历史"></nav>
      <details>
        <summary>Advanced</summary>
        <button id="openLab" disabled>HCL Lab</button>
      </details>
    </aside>

    <main>
      <div class="conversation-title">
        <button id="openMemory" disabled>记忆管理</button>
        <span id="conversationTitle">从一段对话开始</span>
      </div>
      <div id="messages" class="messages" aria-live="polite">
        <section class="empty" id="emptyState">
          <h1>有什么想一起理清？</h1>
          <p>这是静态合成预览。可以体验聊天、Explain、修订和 Lab 外壳，但不会调用真实 HCL 或模型。</p>
          <div class="chips">
            <button data-prompt="她昨晚说没事，今天又不回我，她到底是什么意思？">关系理解</button>
            <button data-prompt="我们争论的到底是事实、忠诚这个概念，还是价值优先级？">概念分歧</button>
            <button data-prompt="如果 A 是决定之后才知道风险，这会怎样改变责任判断？">迟到信息</button>
          </div>
        </section>
      </div>
      <p id="error" role="alert" class="error" hidden></p>
      <div class="composer">
        <textarea id="composer" aria-label="消息" maxlength="65536" placeholder="输入消息；Shift+Enter 换行"></textarea>
        <div>
          <label class="file-button">上传 TXT / Markdown<input id="fileInput" type="file" accept=".txt,.md" hidden /></label>
          <button id="send" disabled>发送</button>
        </div>
        <small>静态 synthetic/mock · 本页不上传数据 · 请不要输入真实私密信息</small>
      </div>
    </main>
  </div>

  <dialog id="panel" class="overlay">
    <button id="closePanel" class="close-button">关闭</button>
    <div id="panelContent"></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
