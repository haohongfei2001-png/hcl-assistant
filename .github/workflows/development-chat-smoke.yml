name: Manual development chat smoke
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      profile:
        description: Initial slot is consumed; continuation uses only the remaining three calls
        type: choice
        required: true
        default: continuation
        options: [initial, continuation]
      model:
        description: Explicit approved DeepSeek model ID (no fallback)
        default: deepseek-v4-pro
        required: true
        type: string
      input_usd_per_million:
        description: Current official maximum/cache-miss input USD per million
        default: '1.32'
        required: true
        type: string
      output_usd_per_million:
        description: Current official maximum output USD per million
        default: '3.96'
        required: true
        type: string
      grant:
        description: Explicit product grant hcla-20261001-six-requests-usd10
        default: hcla-20261001-six-requests-usd10
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: hcla-initial-development-live-grant
  cancel-in-progress: false
jobs:
  original-synthetic-smoke:
    if: github.repository == 'haohongfei2001-png/hcl-assistant' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.user.id == 326690450 && github.event.issue.title == 'HCLA approved smoke continuation 36797830169'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Acquire only the reviewed three-file runtime
        run: |
          mkdir -p .local
          python3 scripts/fetch_development_runtime.py "$RUNNER_TEMP/hcla-reviewed-runtime"
          echo "HCL_DEVELOPMENT_ARTIFACT=$RUNNER_TEMP/hcla-reviewed-runtime" >> "$GITHUB_ENV"
      - name: One bounded product grant; never default CI or automatic retry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HCLA_APPROVED_GRANT: ${{ inputs.grant || 'hcla-20261001-six-requests-usd10' }}
          HCLA_SMOKE_PROFILE: ${{ github.event_name == 'issues' && 'continuation' || inputs.profile }}
          HCLA_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HCLA_DEEPSEEK_BASE_URL: https://api.deepseek.com
          HCLA_DEEPSEEK_MODEL: ${{ inputs.model || 'deepseek-v4-pro' }}
          # No listening service is started by this job; this placeholder is not an access grant.
          HCLA_DEV_ACCESS_TOKEN: offline-no-listening-server-placeholder
          HCLA_DEV_MAX_REQUESTS: ${{ (github.event_name == 'issues' || inputs.profile == 'continuation') && '3' || '6' }}
          HCLA_DEV_MAX_COST_USD: ${{ (github.event_name == 'issues' || inputs.profile == 'continuation') && '5.8233088' || '10' }}
          HCLA_DEV_INPUT_USD_PER_MILLION: ${{ inputs.input_usd_per_million || '1.32' }}
          HCLA_DEV_OUTPUT_USD_PER_MILLION: ${{ inputs.output_usd_per_million || '3.96' }}
          HCLA_DEV_MAX_OUTPUT_TOKENS: ${{ (github.event_name == 'issues' || inputs.profile == 'continuation') && '8192' || '2048' }}
          HCLA_DEV_BUDGET_ID: hcla-20261001-six-requests-usd10
        run: python3 scripts/smoke_development_chat.py
      - name: Retain only original synthetic acceptance and budget metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-chat-original-synthetic-receipt
          path: .local/development-chat-receipt.json
          retention-days: 7
          if-no-files-found: ignore
