name: HCL Assistant Planning

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hcl-assistant-planning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  planning:
    runs-on: ubuntu-24.04
    # Browser installation plus the full visual evidence upload exceeded 8m;
    # keep all assertions and artifacts, with a bounded infrastructure margin.
    timeout-minutes: 12
    env:
      PRODUCT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Materialize this product repository root at exact SHA
        env:
          PRODUCT_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import urllib.request

          repo = os.environ['PRODUCT_REPOSITORY']
          sha = os.environ['PRODUCT_SHA']
          if repo != 'haohongfei2001-png/hcl-assistant':
              raise SystemExit('Only the canonical product repository is allowed')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('An exact commit SHA is required')
          token = os.environ['PRODUCT_READ_TOKEN']
          prefix = 'https://api.github.com/repos/' + repo + '/'

          def get(relative):
              request = urllib.request.Request(prefix + relative, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'hcl-assistant-root-planning',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          commit = get('git/commits/' + sha)
          tree_sha = commit['tree']['sha']
          product = get('git/trees/' + tree_sha + '?recursive=1')
          if product.get('truncated'):
              raise SystemExit('Incomplete product tree')
          destination = Path('product-export')
          destination.mkdir(exist_ok=False)
          blob_count = 0
          for row in product['tree']:
              path = PurePosixPath(row['path'])
              if path.is_absolute() or '..' in path.parts or not path.parts:
                  raise SystemExit('Unsafe product path')
              if row['type'] == 'tree':
                  continue
              if row['type'] != 'blob' or row['mode'] not in ('100644', '100755'):
                  raise SystemExit('Symlink/submodule not allowed')
              banned = {'hcl', 'eval', 'evaluation', 'confirmation', 'credentials', 'secrets', 'data', 'datasets'}
              parts = {part.casefold() for part in path.parts}
              if parts & banned or any('longmemeval' in p or p.startswith('confirmation_') for p in parts):
                  raise SystemExit('Forbidden research/data path; blob not read')
              if path.name.startswith('.env') and path.name != '.env.example':
                  raise SystemExit('Credential path; blob not read')
              blob = get('git/blobs/' + row['sha'])
              if blob.get('encoding') != 'base64':
                  raise SystemExit('Unexpected Git blob encoding')
              content = base64.b64decode(blob['content'])
              digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
              if digest != row['sha']:
                  raise SystemExit('Git blob hash mismatch')
              target = destination.joinpath(*path.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              blob_count += 1
          receipt = {'repository': repo, 'commit_sha': sha, 'product_tree_sha': tree_sha,
                     'materialized_blobs': blob_count, 'research_blobs_read': 0,
                     'provider_calls': 0, 'check_scope': 'PRODUCT_CONTRACTS_BOUNDARY_AND_SYNTHETIC_ACCEPTANCE'}
          Path('product-source-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Acquire exact allowlisted development runtime (public, provider-free)
        env:
          HCLA_RUNTIME_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd product-export
          runtime_dir="$RUNNER_TEMP/hcl-assistant-development-runtime"
          python3 scripts/fetch_development_runtime.py "$runtime_dir" | tee ../development-runtime-source.json
          echo "HCL_DEVELOPMENT_ARTIFACT=$runtime_dir" >> "$GITHUB_ENV"
      - name: Validate product contracts, root boundary and complete migration
        shell: bash
        run: |
          set -euo pipefail
          cd product-export
          python3 -m pip install -r requirements.lock
          python3 scripts/check_planning.py | tee ../planning-receipt.json
          python3 scripts/check_repository.py | tee ../repository-receipt.json
          python3 -m unittest discover -s tests -v 2>&1 | tee ../planning-tests.txt
          python3 scripts/smoke_development_bridge.py "$HCL_DEVELOPMENT_ARTIFACT" > ../runtime-smoke-receipt.json
      - name: Build and verify the synthetic browser product
        shell: bash
        run: |
          set -euo pipefail
          cd product-export
          if test -f package-lock.json; then
            mkdir -p .tmp
            npm ci --ignore-scripts
            npm run build | tee ../web-build.txt
            npx playwright install --with-deps chromium --only-shell
            npm run test:browser 2>&1 | tee ../browser-tests.txt
          fi
      - name: Publish exact-SHA planning and migration receipt
        if: always()
        shell: bash
        run: |
          {
            echo '## HCL Assistant exact-SHA product and experimental development bridge acceptance'
            echo 'Only the independent product repository root was materialized. Synthetic/mock regressions and pinned development runtime integration only; no production activation or efficacy claim.'
            echo '```json'
            test ! -f product-source-receipt.json || cat product-source-receipt.json
            test ! -f planning-receipt.json || cat planning-receipt.json
            test ! -f repository-receipt.json || cat repository-receipt.json
            test ! -f development-runtime-source.json || cat development-runtime-source.json
            echo '```'
            test ! -f runtime-smoke-receipt.json || python3 -c 'import json; p=json.load(open("runtime-smoke-receipt.json")); print(json.dumps({"smoke":p["smoke"],"pin":p["pin"],"interface_identity":p["interface_identity"],"treatments":[r["receipt"]["actual_treatment"] for r in p["runs"]]}))'
            echo '```text'
            test ! -f planning-tests.txt || tail -n 8 planning-tests.txt
            test ! -f web-build.txt || tail -n 8 web-build.txt
            test ! -f browser-tests.txt || tail -n 8 browser-tests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain synthetic visual and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-browser-evidence
          path: |
            product-export/test-results
            product-export/.tmp/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain compact chat refinement captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-refinement-captures
          path: product-export/test-results/chat-refinement*/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain focused initial connection captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-connection-captures
          path: product-export/test-results/startup-connection*/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain focused search navigation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search-focus-captures
          path: |
            product-export/test-results/search-focus*/**/*.png
            product-export/test-results/search-focus*/**/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain focused message action evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: message-menu-captures
          path: |
            product-export/test-results/message-menu-*/**/*.png
            product-export/test-results/message-menu-*/**/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain focused send reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: send-reconciliation-captures
          path: product-export/test-results/send-reconciliation-*/**/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain focused selected-history read evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-read-captures
          path: |
            product-export/test-results/history-read-recovery-*/**/*.png
            product-export/test-results/history-read-recovery-*/**/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain lightweight Continuum reference and app captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuum-local-visual-captures
          path: |
            product-export/test-results/continuum-visual-local*/**/*.png
            product-export/test-results/continuum-visual-local*/**/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain Continuum replay videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuum-replay-videos
          path: product-export/test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

      - name: Retain Pages Continuum captures separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuum-pages-visual-captures
          path: |
            product-export/test-results/continuum-visual-pages*/**/*.png
            product-export/test-results/continuum-visual-pages*/**/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Pair unchanged references with actual Continuum captures
        if: always()
        run: python3 product-export/scripts/compare_continuum_captures.py

      - name: Retain unedited reference comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuum-reference-comparisons
          path: product-export/.tmp/continuum-comparisons
          retention-days: 7
          if-no-files-found: ignore

  cloud-postgres:
    runs-on: ubuntu-24.04
    # Run36931353634 spent 9m on install plus 25 journeys; preserve the full
    # recovery/race suite with a bounded setup margin, without dropping checks.
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: offline-fixture
          POSTGRES_DB: hcla_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hcla_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HCLA_TEST_POSTGRES_DSN: postgresql://postgres:offline-fixture@127.0.0.1:5432/hcla_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned cloud database client
        run: python3 -m pip install -r requirements.lock
      - name: Load host CA bundle in the actual pinned database TLS library
        run: python3 scripts/smoke_cloud_ca.py
      - name: Verify public Supabase pooler TLS without authentication or queries
        run: python3 scripts/smoke_supabase_tls.py
      - name: Exercise actual Vercel Python streaming entrypoint without configuration
        run: |
          python3 -m pip install vercel-runtime==0.22.1
          python3 scripts/smoke_vercel_entrypoint.py
      - name: Acquire only reviewed provider-free runtime
        run: |
          python3 scripts/fetch_development_runtime.py "$RUNNER_TEMP/hcla-cloud-runtime"
          echo "HCL_DEVELOPMENT_ARTIFACT=$RUNNER_TEMP/hcla-cloud-runtime" >> "$GITHUB_ENV"
      - name: Original owner-only schema Qwen compatibility (no member activation)
        env:
          HCLA_TEST_OWNER_SCHEMA_ONLY: '1'
        run: python3 -m unittest tests.test_qwen_owner_schema -v
      - name: Real Postgres independent-instance and temporary-state regressions
        run: python3 -m unittest tests.test_cloud tests.test_cloud_startup tests.test_cloud_postgres tests.test_cloud_trial tests.test_cloud_members tests.test_cloud_recovery tests.test_qwen_provider tests.test_qwen_postgres tests.test_qwen_monthly tests.test_qwen_shared tests.test_qwen_member_readiness tests.test_billing_postgres tests.test_billing_capacity -v
      - name: Shared cloud UI with local injected provider fixture
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run build:cloud
          npx playwright install --with-deps chromium --only-shell
          npx playwright test --config playwright.cloud.config.js
      - name: Retain cloud browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-synthetic-browser-evidence
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
