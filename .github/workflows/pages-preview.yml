name: HCL Assistant Pages Preview

on:
  push:
    branches: [main]
    paths:
      - 'pages-preview/**'
      - '.github/workflows/pages-preview.yml'
      - 'apps/web/src/**'
      - 'vite.pages.config.js'
      - 'package*.json'
      - 'tsconfig.json'
      - 'scripts/check_preview_bundle.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hcl-assistant-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify shared browser-only synthetic preview
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build:preview
          python3 scripts/check_preview_bundle.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
