<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"><title>HCL Assistant · 私人初次设置</title><link rel="stylesheet" href="/owner-setup.css"><script src="/owner-setup.js" defer></script></head>
<body><main><p class="eyebrow">HCL Assistant · 仅首次设置</p><h1>选择你的登录密码</h1><p>这一步只在当前浏览器计算，不发送密码或设置内容，也不创建在线账号。只有你把结果放入自己的托管配置后，服务才会启用。</p><p class="notice">请亲自操作。不要截图，不要将生成结果粘贴到聊天，也不要下载或分享它。完成后关闭本页。</p>
<form id="setup" autocomplete="off"><label for="login">登录账号</label><input id="login" value="owner" maxlength="80" autocomplete="off" required><label for="password">密码（至少 12 个字符）</label><input id="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required><label for="confirmation">再次输入密码</label><input id="confirmation" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required><button id="generate" type="submit">生成私人设置</button></form>
<p id="status" role="status"></p><section id="result" hidden><h2>保存一次，以后直接登录</h2><p>在你自己的 Vercel 安全环境变量界面，将名称设为 <strong>HCLA_OWNER_CONFIG</strong>，值粘贴下面的私人设置。模型、费用和数据库配置由管理员另外准备，不需要每次启动填写。</p><label for="bundle">私人设置（默认隐藏）</label><input id="bundle" type="password" readonly autocomplete="off"><div class="actions"><button id="copy" type="button">复制到剪贴板</button><button id="clear" type="button">清空本页</button></div><p>本页不写入浏览器存储，不生成下载文件。复制会把设置放到你的系统剪贴板，请只粘贴到托管平台的安全表单。</p></section></main></body>
</html>
